name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-spring/rain-cheque-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and verify
        env:
          SPRING_SECURITY_JWT_SECRET: ci-test-secret-at-least-32-characters-long
          APP_QR_SECRET: ci-test-qr-secret
        run: ./mvnw verify -B
