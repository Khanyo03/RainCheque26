apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-cheque-frontend
  namespace: raincheque
  labels:
    app: rain-cheque-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rain-cheque-frontend
  template:
    metadata:
      labels:
        app: rain-cheque-frontend
    spec:
      containers:
        - name: frontend
          image: rain-cheque-frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: rain-cheque-frontend
  namespace: raincheque
spec:
  selector:
    app: rain-cheque-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
