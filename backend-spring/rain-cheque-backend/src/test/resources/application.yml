# Test configuration — overrides main application.yml for tests
spring:
  application:
    name: rain-cheque-api-test

  datasource:
    url: jdbc:h2:mem:raincheque_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: false

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      schema-locations: ""
      data-locations: classpath:data.sql

  security:
    jwt:
      secret: test-jwt-secret-key-for-integration-tests-must-be-at-least-32-bytes
      expiration: 86400000
      refresh-expiration: 604800000

  batch:
    jdbc:
      initialize-schema: always

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25

server:
  port: 0
  error:
    include-message: always
    include-binding-errors: always

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    com.raincheque: WARN
    org.springframework.security: WARN

payment:
  default-provider: PAYSTACK
  providers:
    PAYSTACK:
      enabled: true
      api-key: sk_test_fake_paystack_key_for_testing
      webhook-secret: whsec_test_fake_paystack_secret_for_testing
    STRIPE:
      enabled: false
      api-key: sk_test_fake_key_for_testing
      webhook-secret: whsec_test_fake_secret_for_testing

app:
  cors:
    allowed-origins: http://localhost:5173
  upload:
    dir: ./uploads
  qr:
    secret: test-qr-secret-for-integration-tests
  ticket:
    batch-size: 100
    storage-path: ./tickets
    email-attachment-enabled: false
