# Development profile - H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:raincheque;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  sql:
    init:
      mode: always
      schema-locations: ""
      data-locations: classpath:data.sql

  mail:
    host: localhost
    port: 25

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
    redis:
      enabled: false

payment:
  default-provider: PAYSTACK
  providers:
    PAYSTACK:
      enabled: true
      api-key: ${PAYSTACK_API_KEY:}
      webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}

    STRIPE:
      enabled: false

    PAYFAST:
      enabled: false

    YOCO:
      enabled: false

    PEACH:
      enabled: false

    OZOW:
      enabled: false

logging:
  level:
    com.raincheque: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.datasource.init: DEBUG
