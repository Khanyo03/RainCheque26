spring:
  application:
    name: rain-cheque-api

  profiles:
    active: dev

  # Disable Flyway since we're using H2 in dev / manual migrations in prod
  flyway:
    enabled: false

  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET}
      expiration: 86400000 # 24 hours in milliseconds
      refresh-expiration: 604800000 # 7 days

server:
  port: 8081
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    dir: ./uploads
  qr:
    secret: ${APP_QR_SECRET}
  ticket:
    batch-size: 100
    storage-path: ./tickets
    email-attachment-enabled: false
