spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: rain-cheque-api

  profiles:
    active: dev

  # Disable Flyway since we're using H2 in dev / manual migrations in prod
  flyway:
    enabled: false

  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET}
      expiration: 86400000 # 24 hours in milliseconds
      refresh-expiration: 604800000 # 7 days

server:
  port: 8081
  address: 0.0.0.0
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    org.springframework.security: INFO

payment:
  default-provider: PAYSTACK
  providers:
    PAYSTACK:
      enabled: true
      api-key: ${PAYSTACK_API_KEY:}
      webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}
    STRIPE:
      enabled: false
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    PAYFAST:
      enabled: false
      api-key: ${PAYFAST_API_KEY:}
      webhook-secret: ${PAYFAST_WEBHOOK_SECRET:}
      properties:
        merchant-id: ${PAYFAST_MERCHANT_ID:}
        merchant-key: ${PAYFAST_MERCHANT_KEY:}
    YOCO:
      enabled: false
      api-key: ${YOCO_SECRET_KEY:}
      webhook-secret: ${YOCO_WEBHOOK_SECRET:}
    PEACH:
      enabled: false
      api-key: ${PEACH_API_KEY:}
      webhook-secret: ${PEACH_WEBHOOK_SECRET:}
    OZOW:
      enabled: false
      api-key: ${OZOW_API_KEY:}
      webhook-secret: ${OZOW_WEBHOOK_SECRET:}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    dir: ./uploads
  qr:
    secret: ${APP_QR_SECRET}
  ticket:
    batch-size: 100
    storage-path: ./tickets
    email-attachment-enabled: false
